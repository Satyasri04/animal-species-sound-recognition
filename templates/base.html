<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Identify animal species from their sounds using deep learning. Upload an audio file and get instant predictions.">
    <title>{% block title %}Animal Sound Recognition{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">Analyzing audio...</div>
        <div class="loading-emoji">🎵</div>
    </div>

    <!-- Particles -->
    <div class="particle-container" id="particleContainer"></div>

    <!-- Animated Gradient Orbs -->
    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page-wrapper">
        {% include 'components/navbar.html' %}

        <div class="container">
            {% block content %}{% endblock %}
        </div>

        <footer class="footer">
            <p>Built with YAMNet & Deep Learning &middot; Animal Sound Recognition &copy; 2026</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
